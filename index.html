<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z-CYBERCORE // WAR ROOM</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap');
    :root { --bg: #030305; --panel: #0a0e17; --border: #1a2333; --red: #ff003c; --green: #00ff66; --cyan: #00f3ff; --yellow: #ffae00; --text: #e2e8f0; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Fira Code', monospace; }
    body { background: var(--bg); color: var(--text); padding: 15px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { border-bottom: 2px solid var(--red); padding-bottom: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: flex-end; }
    h1 { color: var(--red); font-size: 1.5rem; text-shadow: 0 0 10px rgba(255,0,60,0.4); letter-spacing: 2px; }
    .status-badge { background: rgba(0,255,102,0.1); border: 1px solid var(--green); color: var(--green); padding: 4px 10px; font-size: 0.75rem; font-weight: bold; border-radius: 3px; }
    .terminal { flex-grow: 1; background: #000; border: 1px solid var(--border); padding: 12px; overflow-y: auto; display: flex; flex-direction: column; font-size: 0.8rem; }
    .terminal-header { font-size: 0.7rem; color: #555; border-bottom: 1px dashed #333; padding-bottom: 6px; margin-bottom: 8px; text-transform: uppercase; display: flex; justify-content: space-between; }
    .log-entry { margin-bottom: 6px; word-break: break-all; }
    .log-time { color: #666; margin-right: 8px; }
    .log-sys { color: var(--cyan); } .log-err { color: var(--red); font-weight: bold; } .log-success { color: var(--green); } .log-warn { color: var(--yellow); }
    .input-line { display: flex; gap: 8px; margin-top: auto; padding-top: 10px; border-top: 1px solid #111; }
    .prompt { color: var(--green); font-weight: bold; }
    input[type="text"] { flex-grow: 1; background: transparent; border: none; color: #fff; font-family: 'Fira Code', monospace; font-size: 0.85rem; outline: none; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Z-CYBERCORE // LIVE TERMINAL</h1>
      <span style="color: #8892b0; font-size: 0.75rem;">Connessione WebSocket Reale Attiva</span>
    </div>
    <div class="status-badge" id="ws-status">NODE JS: CONNECTING...</div>
  </header>

  <div class="terminal">
    <div class="terminal-header">
      <span>Z-LANG DISPATCHER // LOG STREAM</span>
    </div>
    
    <div id="log-container" style="flex-grow: 1; overflow-y: auto;">
      <div class="log-entry"><span class="log-sys">[SYSTEM]</span> Inizializzazione socket...</div>
    </div>

    <div class="input-line">
      <span class="prompt">root@cybercore:~#</span>
      <input type="text" id="cmd-input" placeholder="Invia un comando (es: ping, help)..." autocomplete="off">
    </div>
  </div>

  <script>
    const input = document.getElementById('cmd-input');
    const log = document.getElementById('log-container');
    const badge = document.getElementById('ws-status');

    function getTime() { return new Date().toLocaleTimeString('it-IT', { hour12: false }); }

    function appendLog(type, text) {
      let cssClass = 'log-sys';
      if(type === 'err') cssClass = 'log-err';
      if(type === 'success') cssClass = 'log-success';
      if(type === 'warn') cssClass = 'log-warn';
      log.innerHTML += `<div class="log-entry"><span class="log-time">[${getTime()}]</span><span class="${cssClass}">[${type.toUpperCase()}]</span> ${text}</div>`;
      log.scrollTop = log.scrollHeight;
    }

    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${window.location.host}/ws/`);

    ws.onopen = () => {
        badge.innerText = "NODE JS: ONLINE";
        badge.style.color = "var(--cyan)";
        badge.style.borderColor = "var(--cyan)";
        appendLog('success', 'Handshake stabilito. Tunnel crittografato aperto verso la VPS.');
    };

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        appendLog(data.type, data.message);
    };

    ws.onclose = () => {
        badge.innerText = "NODE JS: OFFLINE";
        badge.style.color = "var(--red)";
        badge.style.borderColor = "var(--red)";
        appendLog('err', 'Connessione con il backend persa.');
    };

    input.addEventListener('keypress', function(e) {
      if (e.key === 'Enter' && this.value.trim() !== '') {
        const cmd = this.value.trim();
        appendLog('sys', `>> ${cmd}`);
        
        if(ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ cmd: cmd }));
        } else {
            appendLog('err', 'Impossibile inviare: Socket offline.');
        }
        this.value = '';
      }
    });
  </script>
</body>
</html>
